{% extends "base.html" %}

{% block content %}

<h2>Delete Event</h2>

<p>
Are you sure you want to delete:
<strong>{{ event.title }}</strong>?
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'my_events' %}">
        Cancel
    </a>

</form>

{% endblock %}
