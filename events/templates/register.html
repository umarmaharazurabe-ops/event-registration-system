{% extends 'base.html' %}
{% load static %}

{% block title %}
Register
{% endblock %}

{% block content %}

<section class="login-section">

    <div class="login-container">

        <div class="login-header">
            <h1>Create Account</h1>
            <p>Join Event Registration System</p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">
                <label>Full Name</label>
                <input
                    type="text"
                    name="full_name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="input-box">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required>
            </div>

            <div class="input-box">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input
                    type="password"
                    name="password1"
                    placeholder="Create a password"
                    required>
            </div>

            <div class="input-box">
                <label>Confirm Password</label>
                <input
                    type="password"
                    name="password2"
                    placeholder="Confirm your password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                Create Account
            </button>

        </form>

        <div class="login-footer">
            <p>
                Already have an account?
                <a href="/login/">Login</a>
            </p>
        </div>

    </div>

</section>

{% endblock %}
