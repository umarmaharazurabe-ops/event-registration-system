{% extends 'base.html' %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<section class="profile-page">

<div class="profile-card">

<h2>Edit Profile</h2>

<form method="POST">

{% csrf_token %}

<input
type="text"
name="full_name"
value="{{ request.user.first_name }}"
placeholder="Full Name"
required>

<br><br>

<input
type="email"
name="email"
value="{{ request.user.email }}"
placeholder="Email"
required>

<br><br>

<button
type="submit"
class="btn">

Save Changes

</button>

</form>

</div>

</section>

{% endblock %}
